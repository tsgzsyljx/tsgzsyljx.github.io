<p>
患者入 <strong>贵州省人民医院急诊内科</strong> 就诊，当时基本情况如下：1）体温38.8度；2）心率150左右；3）氧饱70左右；4）呼吸衰竭；5）有痰。
</p>
<p>	稍加思索，略微分析，甚至凭直觉，都可以得出结论：可能是痰部分堵住气管了，而处理方式也很简单：吸痰！</p>
	
<p><strong>廖剑雄</strong> 完全没有考虑患者，甚至在我用纸和压舌板清理口腔里的痰，并告知其痰不少时，他仍然心不在焉，无动于衷，既没有提出可以吸痰，更没有到病床前查看。</p>

<p><strong>廖剑雄</strong> 极端不负责，不尊重生命，不人道，必须为此负责。</p>
